# ================================================================
#  TV CRM — Nginx Konfiguratsiyasi
#
#  Qo'yish joyi: /etc/nginx/sites-available/crm
#  Faollashtirish: sudo ln -s /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/
#  Qayta ishga tushirish: sudo systemctl reload nginx
# ================================================================

# HTTP → HTTPS yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name sizning-domen.uz www.sizning-domen.uz;

    # Let's Encrypt tekshiruvi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Hammani HTTPS ga yo'naltirish
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Asosiy server ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sizning-domen.uz www.sizning-domen.uz;

    # ── SSL Sertifikat (Let's Encrypt) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/sizning-domen.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sizning-domen.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Xavfsizlik sarlavhalari ────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Fayl yuklash chegarasi ─────────────────────────────────
    client_max_body_size 10M;

    # ── Gzip siqish ───────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ── 1. HTML CRM — Asosiy sahifa ───────────────────────────
    root /var/www/crm;
    index index.html CRM_Tizimi.html;

    location / {
        try_files $uri $uri/ /index.html;

        # CRM faylini kesh qilmaymiz (har doim yangi versiya)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # HTML va statik fayllar
    location ~* \.(html|css|js|ico|svg|png|jpg|jpeg|gif|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── 2. FastAPI Backend ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API dokumentatsiyasi
    location /docs { proxy_pass http://127.0.0.1:8000/docs; }
    location /redoc { proxy_pass http://127.0.0.1:8000/redoc; }

    # ── 3. WebSocket (Bot server) ──────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;  # WebSocket uzoq vaqt ochiq qolishi mumkin
        proxy_send_timeout 3600s;
    }

    # ── Xatolik sahifalari ─────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
