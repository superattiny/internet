version: '3.9'

# ================================================================
#  TV CRM — Docker Compose
#  PostgreSQL + pgAdmin (boshqaruv paneli)
#
#  Ishga tushirish:
#    docker-compose up -d
#  
#  To'xtatish:
#    docker-compose down
#
#  Ma'lumotlarni o'chirish:
#    docker-compose down -v
# ================================================================

services:

  # ── PostgreSQL Ma'lumotlar Bazasi ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tv_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_password123}
      POSTGRES_DB:       ${DB_NAME:-tv_crm}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_user} -d ${DB_NAME:-tv_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin — Web-based DB boshqaruv paneli ─────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tv_crm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@crm.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# ================================================================
#  Ulanish ma'lumotlari:
#
#  PostgreSQL:
#    Host:     localhost:5432
#    DB:       tv_crm
#    User:     crm_user
#    Password: crm_password123
#
#  pgAdmin UI:
#    URL:      http://localhost:5050
#    Login:    admin@crm.local
#    Password: admin123
# ================================================================
